<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7bios Beauty • Catálogo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><div id="book"></div></div>
<button id="indice-open" class="indice-open" type="button" aria-label="Abrir índice de produtos" aria-expanded="false" aria-controls="indice">☰</button>
<div id="indice-backdrop" class="indice-backdrop" aria-hidden="true"></div>
<aside id="indice" class="indice" role="dialog" aria-modal="true" aria-labelledby="indice-title" aria-hidden="true">
  <div class="indice-header">
    <h2 id="indice-title">Índice de produtos</h2>
    <button id="indice-close" class="indice-close" type="button" aria-label="Fechar índice">×</button>
  </div>
  <nav id="indice-list" class="indice-list" aria-label="Produtos"></nav>
</aside>
<nav id="ui">
  <button id="prev" aria-label="Página anterior">‹</button>
  <span id="pos">Capa</span>
  <button id="next" aria-label="Próxima página">›</button>
  <button id="mute" aria-label="Som" title="Som ligado/desligado">🔊</button>
  <button id="fullscreen" aria-label="Ativar tela cheia" title="Ativar tela cheia">⛶</button>
</nav>
<div id="fullscreen-status" class="fullscreen-status" role="status" aria-live="polite"></div>
<script src="catalogo.js"></script>
</body>
</html>
